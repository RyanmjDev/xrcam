name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# macOS runners bill at a 10x multiplier against the Actions allowance.
# Cancel superseded runs so a rapid series of pushes costs one build, not five.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    # The build itself takes ~30s. A job sitting far past that is stuck waiting
    # on runner allocation, not compiling — fail fast instead of holding the
    # concurrency group open.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -project XRCam.xcodeproj -list

      # Signing is intentionally disabled. Sideloadly re-signs on Windows with
      # your Apple ID, which avoids managing certificates and provisioning
      # profiles in CI entirely.
      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project XRCam.xcodeproj \
            -scheme XRCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # A bundle with no compiled asset catalog and no CFBundleIconName is
      # rejected by the device at install time as an invalid file — and the
      # xcodebuild step still reports success, so it has to be caught here.
      - name: Validate app bundle
        run: |
          APP="build/Build/Products/Release-iphoneos/XRCam.app"
          fail=0

          if [ ! -f "$APP/Assets.car" ]; then
            echo "::error::Assets.car missing — asset catalog was not compiled"
            fail=1
          fi

          if ! plutil -extract CFBundleIconName raw "$APP/Info.plist" >/dev/null 2>&1; then
            echo "::error::CFBundleIconName missing from Info.plist"
            fail=1
          fi

          echo "--- bundle contents ---"
          ls -la "$APP"

          # Dump the processed plist — without this, a validation failure means
          # guessing at what the build actually produced, and each guess costs
          # a full round trip.
          echo "--- processed Info.plist ---"
          plutil -p "$APP/Info.plist"

          exit $fail

      # An .ipa is just a zip containing a Payload/ directory.
      - name: Package .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/XRCam.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Build produced no .app at $APP"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry XRCam.ipa Payload
          ls -lh XRCam.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XRCam-ipa
          path: XRCam.ipa
          if-no-files-found: error
          retention-days: 30
